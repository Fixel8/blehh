<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'JetBrains Mono', monospace;
  }
  .timer-display {
    font-size: 80px;
    font-weight: 300;
    letter-spacing: -2px;
    color: #ffffff;
  }
  .timer-label {
    font-size: 14px;
    font-weight: 300;
    color: #555;
    margin-top: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
  }
  .timer-end {
    font-size: 48px;
    font-weight: 300;
    display: none;
    color: #fff;
  }
</style>
</head>
<body>
<div class="timer-display" id="timer"></div>
<div class="timer-label">until HOME!!!!!!!!!!</div>
<div class="timer-end" id="end">been so long, happy livin</div>
<script>
  const target = Date.UTC(2034, 6, 6, 0, 0, 0)
  const t = document.getElementById("timer")
  const e = document.getElementById("end")
  const tick = () => {
    const diff = Math.floor((target - Date.now()) / 1000)
    if (diff <= 0) {
      t.style.display = "none"
      e.style.display = "block"
      clearInterval(i)
      return
    }
    t.textContent = `${Math.ceil(diff / 86400)}d`
  }
  tick()
  const i = setInterval(tick, 60000)
</script>
</body>
</html>
